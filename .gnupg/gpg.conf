# Strong defaults for GnuPG 2.2+ (dna5rm). Copied by Initialize-Gpg into $GNUPGHOME.
# Do not put a default-key fingerprint here — host-specific.

charset utf-8
no-emit-version
no-comments
no-greeting
keyid-format 0xlong
with-fingerprint
list-options show-uid-validity
verify-options show-uid-validity
use-agent
require-cross-certification
no-symkey-cache

personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP
cert-digest-algo SHA512
cipher-algo AES256
digest-algo SHA512
compress-algo 2
disable-cipher-algo 3DES
disable-cipher-algo CAST5
weak-digest SHA1

s2k-cipher-algo AES256
s2k-digest-algo SHA512
s2k-mode 3
s2k-count 65011712

default-new-key-algo ed25519/cert,sign+cv25519/encr
